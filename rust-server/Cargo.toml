[package]
name = "local-monitor-rust"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde_json = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "process", "io-util", "signal"] }
async-stream = "0.3"
futures-core = "0.3"
rusqlite = "0.38"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
